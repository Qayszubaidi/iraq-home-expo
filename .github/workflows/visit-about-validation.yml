name: Visit and About validation

on:
  push:
    branches: [visit-about-content]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared copy and page styles
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))

          replace_once(
              "src/data/site.ts",
              '  dates: "12–15 May 2027",',
              '  dates: "12 to 15 May 2027",'
          )
          replace_once(
              "src/data/site.ts",
              '    "Baghdad International Fair is accredited as Iraq\'s foremost comprehensive exhibition centre, fully equipped with conference halls, extensive car parking, unlimited floor loads, central air-conditioning and food & beverage outlets — the infrastructure a four-day international trade exhibition requires.",',
              '    "Baghdad International Fair is one of Iraq\'s main exhibition venues, with conference halls, extensive parking, large exhibition floors, central air conditioning and food and beverage facilities suited to a major international trade event.",'
          )
          replace_once(
              "src/data/site.ts",
              '    "The venue occupies one of Baghdad\'s most prominent locations, close to several five-star hotels, shopping destinations and sightseeing areas, and only minutes from Baghdad International Airport — making it straightforward for international exhibitors and visitors to reach.",',
              '    "The venue is in a prominent part of Baghdad, close to hotels, shopping destinations and visitor attractions, with convenient access for local and international exhibitors and visitors.",'
          )

          css=Path("src/app/globals.css")
          text=css.read_text()
          marker="/* === VISIT AND ABOUT PAGE REFINEMENT === */"
          if marker not in text:
              text += r'''

/* === VISIT AND ABOUT PAGE REFINEMENT === */
.visitPlanner,.visitVenue,.visitReasons,.visitSectors,.aboutStory,.aboutBusiness,.aboutConnections,.aboutSectors{width:min(var(--site-max),calc(100% - (var(--site-gutter) * 2)));margin-left:auto;margin-right:auto}
.visitPlanner{margin-top:clamp(64px,7vw,104px);margin-bottom:clamp(82px,8vw,120px);padding:clamp(42px,5vw,70px);background:#f8f5ef;border-top:3px solid var(--gold);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:clamp(42px,6vw,88px);align-items:start}
.visitPlannerIntro h2,.visitVenueCopy h2,.visitReasonsHead h2,.visitSectors h2,.aboutStory h2,.aboutSectionHead h2,.aboutConnections h2,.aboutSectors h2{font-family:var(--font-display),"Montserrat",sans-serif;letter-spacing:-.035em;text-wrap:balance}
.visitPlannerIntro h2{font-size:clamp(36px,4.2vw,60px);line-height:1.02;margin:14px 0 22px;max-width:820px}
.visitPlannerIntro p,.visitReasonsHead p,.visitSectors>div:first-child p,.aboutStoryCopy p,.aboutConnections>div:first-child p,.aboutSectorsIntro p{color:#68625c;line-height:1.75}
.visitPlannerIntro p{font-size:16px;max-width:700px;margin:0}
.visitFacts{display:grid;gap:1px;background:#d8d1c6;border:1px solid #d8d1c6}.visitFact{background:#fff;padding:22px 24px;display:grid;grid-template-columns:36px 1fr;column-gap:12px}.visitFact>span{grid-row:1/4;color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.12em;padding-top:3px}.visitFact small{color:#817a72;font-size:9px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.visitFact strong{font:700 18px/1.3 var(--font-display);margin-top:4px;color:#2d2929}.visitFact p{margin:4px 0 0;color:#766f68;font-size:12px}
.visitVenue{margin-top:0;margin-bottom:clamp(90px,9vw,136px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);min-height:590px;background:#073f3d}.visitVenueMedia{position:relative;min-height:590px;overflow:hidden}.visitVenueMedia figure{margin:0;position:absolute;overflow:hidden}.visitVenueMedia img{object-fit:cover}.visitVenueMain{inset:0 18% 0 0}.visitVenueInset{width:46%;height:45%;right:5%;bottom:6%;border:10px solid #073f3d;box-shadow:0 20px 50px rgba(0,0,0,.2)}.visitVenueCopy{color:#fff;padding:clamp(52px,5vw,82px) clamp(34px,4vw,66px);display:flex;flex-direction:column;justify-content:center}.visitVenueCopy h2{font-size:clamp(34px,3.6vw,54px);line-height:1.03;margin:15px 0 24px}.visitVenueCopy p{font-size:15px;line-height:1.75;color:rgba(255,255,255,.76);margin:0 0 18px}.visitVenueCopy .button{margin-top:14px;align-self:flex-start}
.visitReasons{margin-bottom:clamp(90px,9vw,132px);display:grid;grid-template-columns:minmax(280px,.7fr) minmax(0,1.3fr);gap:clamp(44px,6vw,90px);align-items:start}.visitReasonsHead{position:sticky;top:118px}.visitReasonsHead h2{font-size:clamp(34px,3.6vw,54px);line-height:1.04;margin:14px 0 20px}.visitReasonsHead p{font-size:15px;margin:0;max-width:480px}.visitReasonGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#ddd6cb;border:1px solid #ddd6cb}.visitReasonGrid article{background:#fff;padding:30px;min-height:230px}.visitReasonGrid article>span{color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.12em}.visitReasonGrid h3{font:700 24px/1.15 var(--font-display);margin:30px 0 14px}.visitReasonGrid p{color:#746d66;font-size:13px;line-height:1.65;margin:0}.visitAudience{margin-top:0!important}
.visitSectors{margin-top:clamp(88px,9vw,132px);margin-bottom:clamp(90px,9vw,132px);display:grid;grid-template-columns:minmax(270px,.62fr) minmax(0,1.38fr);gap:clamp(42px,6vw,90px);align-items:start}.visitSectors h2{font-size:clamp(34px,3.5vw,52px);line-height:1.04;margin:14px 0 18px}.visitSectors>div:first-child p{font-size:15px;margin:0}.visitSectorChips{padding:0!important;margin:0!important}
.aboutStory{margin-top:clamp(72px,8vw,112px);margin-bottom:clamp(80px,8vw,118px);display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.22fr);gap:clamp(48px,7vw,112px);align-items:start}.aboutStoryTitle h2{font-size:clamp(38px,4.5vw,66px);line-height:1;margin:14px 0 0}.aboutStoryCopy{padding-top:28px;border-top:3px solid var(--gold);max-width:780px}.aboutStoryCopy p{font-size:16px;margin:0 0 22px}.aboutStoryCopy p:last-child{margin-bottom:0}
.aboutBusiness{margin-bottom:clamp(90px,9vw,132px)}.aboutSectionHead{max-width:900px;margin-bottom:44px}.aboutSectionHead h2{font-size:clamp(36px,4.2vw,60px);line-height:1.02;margin:14px 0 0}.aboutBusinessGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#dcd5ca;border:1px solid #dcd5ca}.aboutBusinessCard{background:#fff;padding:34px;min-height:290px}.aboutBusinessCard>span{color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.12em}.aboutBusinessCard h3{font:700 25px/1.15 var(--font-display);margin:44px 0 16px}.aboutBusinessCard p{color:#746d66;font-size:14px;line-height:1.7;margin:0}
.aboutConnections{margin-bottom:clamp(90px,9vw,132px);padding:clamp(52px,6vw,84px);background:#f8f5ef;display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);gap:clamp(44px,6vw,88px)}.aboutConnections h2{font-size:clamp(34px,3.7vw,54px);line-height:1.04;margin:14px 0 20px}.aboutConnections>div:first-child p{margin:0;font-size:15px}.aboutAudienceTags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}.aboutAudienceTags span{background:#fff;border:1px solid #ddd6cb;padding:15px 16px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:650}.aboutAudienceTags b{color:var(--gold);font-size:9px;letter-spacing:.1em}
.aboutSectors{margin-bottom:clamp(96px,10vw,146px);display:grid;grid-template-columns:minmax(280px,.65fr) minmax(0,1.35fr);gap:clamp(44px,6vw,90px)}.aboutSectorsIntro h2{font-size:clamp(34px,3.6vw,54px);line-height:1.04;margin:14px 0 20px}.aboutSectorsIntro p{font-size:15px;margin:0 0 24px}.aboutSectorLinks{border-top:1px solid #d8d1c6}.aboutSectorLinks a{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:20px 4px;border-bottom:1px solid #d8d1c6;transition:padding .25s ease,background .25s ease}.aboutSectorLinks a:hover{padding-left:14px;padding-right:14px;background:#faf8f4}.aboutSectorLinks a>span{color:var(--gold);font-size:10px;font-weight:750}.aboutSectorLinks strong{font:700 clamp(17px,1.7vw,23px)/1.2 var(--font-display)}.aboutSectorLinks b{color:var(--gold);font-size:18px}
@media(max-width:980px){.visitPlanner,.visitVenue,.visitReasons,.visitSectors,.aboutStory,.aboutConnections,.aboutSectors{grid-template-columns:1fr}.visitReasonsHead{position:static}.visitVenueMedia{min-height:480px}.visitVenue{min-height:0}.aboutBusinessGrid{grid-template-columns:1fr}.aboutBusinessCard{min-height:0}}
@media(max-width:760px){.visitPlanner,.visitVenue,.visitReasons,.visitSectors,.aboutStory,.aboutBusiness,.aboutConnections,.aboutSectors{width:calc(100% - 32px)}.visitPlanner{margin-top:52px;padding:32px 22px}.visitPlannerIntro h2{font-size:34px}.visitVenueMedia{min-height:370px}.visitVenueMain{inset:0 8% 0 0}.visitVenueInset{width:50%;height:40%;right:2%;bottom:4%;border-width:6px}.visitVenueCopy{padding:42px 24px}.visitReasonGrid{grid-template-columns:1fr}.visitReasonGrid article{min-height:0}.aboutStory{margin-top:58px}.aboutStoryTitle h2{font-size:36px}.aboutConnections{padding:34px 22px}.aboutAudienceTags{grid-template-columns:1fr}}
'''
              css.write_text(text)

      - name: Verify visible dash punctuation on updated pages
        shell: python
        run: |
          from pathlib import Path
          for path in ["src/app/visit/page.tsx","src/app/about/page.tsx"]:
              text=Path(path).read_text()
              for ch in ["—","–"]:
                  if ch in text:
                      raise SystemExit(f"Dash punctuation found in {path}: {ch}")

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/visit-about-validation.yml
          git add src/data/site.ts src/app/globals.css .github/workflows/visit-about-validation.yml
          git commit -m "Refine Visit and About page presentation"
          git push origin HEAD:visit-about-content
